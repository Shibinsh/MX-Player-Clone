name: mx_player_clone
description: A modern Flutter Android video player inspired by MX Player.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.11.1
  photo_manager: ^3.9.0
  permission_handler: ^12.0.0+1
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  screen_brightness: ^2.1.8
  volume_controller: ^3.5.0
  just_audio: ^0.10.5
  share_plus: ^12.0.1
  file_picker: ^11.0.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  fvp: ^0.37.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
